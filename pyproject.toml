[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-engine"
version = "0.2.0"
description = "One shared memory for coding agents (Claude Code, Codex, Cursor) over MCP, with token-budgeted recall and an evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nina Doinjashvili" }]
keywords = ["ai-agents", "mcp", "memory", "retrieval", "embeddings", "llm"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Real semantic embeddings + exact token accounting. Drop-in, no code change.
real = ["sentence-transformers>=2.2", "tiktoken>=0.5"]
# Model Context Protocol server so agents can call the engine as tools.
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/Ninadnj/ai-agent-memory-scaffold"
Issues = "https://github.com/Ninadnj/ai-agent-memory-scaffold/issues"

[project.scripts]
agent-memory = "agent_memory.cli:main"
agent-memory-mcp = "agent_memory.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
testpaths = ["tests"]
