[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-engine"
version = "0.4.0rc2"
description = "Local project memory for coding agents, with traceable corrections, bounded recall and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nina Doinjashvili" }]
keywords = ["ai-agents", "mcp", "memory", "retrieval", "embeddings", "llm"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Real semantic embeddings + exact token accounting. Drop-in, no code change.
real = ["sentence-transformers>=2.2", "tiktoken>=0.5"]
# Model Context Protocol server so agents can call the engine as tools.
# Both the 1.x (FastMCP) and 2.x (MCPServer) APIs are supported.
mcp = ["mcp>=1.0,<3"]
# `dev` pulls in mcp and tiktoken on purpose: the MCP server is the headline
# feature and must be exercised in CI. tiktoken provides cl100k_base accounting.
dev = ["pytest>=7.0", "mcp>=1.0,<3", "tiktoken>=0.5,<1", "build>=1", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/Ninadnj/agent-memory-engine"
Issues = "https://github.com/Ninadnj/agent-memory-engine/issues"

[project.scripts]
agent-memory = "agent_memory.cli:main"
agent-memory-mcp = "agent_memory.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# This executable runner adds src/ to sys.path before importing the package.
"eval/run_tasks.py" = ["E402"]
